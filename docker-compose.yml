services:

  nginx:
    image: nginx:1.29.0-alpine
    container_name: loadbalancer
    ports:
      - 80:80
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app-rr1
      - app-rr2
    networks:
      - mknet

  app-rr1:
    container_name: app_one
    environment:
      APP_INSTANCE: app-1
    build:
      context: ./roadrunner/dockerfile
    working_dir: /var/www/app
    volumes:
      - ./php-app:/var/www/app
    networks:
      - mknet

  app-rr2:
    container_name: app_two
    environment:
      APP_INSTANCE: app-2
    build:
      context: ./roadrunner/dockerfile
    working_dir: /var/www/app
    volumes:
      - ./php-app:/var/www/app
    networks:
      - mknet

networks:
  mknet:
    driver: bridge